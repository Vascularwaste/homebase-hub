    background-repeat: repeat;
    background-size: 760px 760px;
    background-position: 0 0;
    background-attachment: fixed;
  }

  .world-clock{
    background: #0c0c0c;
  }
  .wc-inner{
    max-width: 1600px;
    margin: 0 auto;
    padding: 5px 20px 3px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }
  .wc-cell{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .wc-cell:last-child{ border-right: none; }
  .wc-time{
    font-family: var(--mono);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    color: #ff3b3b;
    text-shadow: 0 0 5px rgba(255,59,59,0.5), 0 0 12px rgba(255,59,59,0.22);
    line-height: 1.15;
  }
  .wc-city{
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #37ff6b;
    text-shadow: 0 0 3px rgba(55,255,107,0.35);
    white-space: nowrap;
    margin-top: 1px;
  }
  .wc-wx{
    text-align: center;
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #ffb31a;
    text-shadow: 0 0 4px rgba(255,179,26,0.4);
    padding: 2px 16px 5px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .wc-wx .wc-src{
    color: rgba(255,233,194,0.5);
    text-shadow: none;
    font-weight: 600;
    margin-left: 6px;
  }

  .topbar{
    background: var(--bar);
    border-bottom: 3px solid var(--ink);
  }
  .topbar-inner{
    max-width: 1600px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .wordmark{
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .date-pill{
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 7px 18px;
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .banner{
    max-width: 1600px;
    margin: 16px auto 0;
    padding: 0 20px;
  }
  .banner-inner{
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    text-align: center;
  }

  .stage{
    max-width: 1600px;
    margin: 20px auto 40px;
    padding: 0 20px;
  }

  .mosaic{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-areas:
      "enforcement enforcement"
      "quotes dictionary"
      "phrases law"
      "gracian gracian"
      "books books";
    gap: var(--seam);
    border: 3px solid var(--ink);
  }
  @media (max-width: 760px){
    .mosaic{
      grid-template-columns: 1fr;
      grid-template-areas:
        "enforcement"
        "quotes"
        "dictionary"
        "phrases"
        "law"
        "gracian"
        "books";
    }
  }

  .block{
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 30px 28px;
    min-height: 200px;
    overflow: hidden;
  }
  .block[data-key="quotes"]{ grid-area: quotes; }
  .block[data-key="dictionary"]{ grid-area: dictionary; }
  .block[data-key="phrases"]{ grid-area: phrases; }
  .block[data-key="dailylaw"]{ grid-area: law; }
  .block[data-key="dailyenforcement"]{ grid-area: enforcement; min-height: 280px; }
  .block[data-key="gracian"]{ grid-area: gracian; min-height: 280px; }
  .block[data-key="books"]{ grid-area: books; min-height: 340px; }

  .block .tag{
    display: inline-block;
    align-self: flex-start;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.35);
  }
  .block .headline{
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.05;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .block .headline{ font-size: clamp(24px, 2.7vw, 36px); text-transform: uppercase; }

  .block .support{
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.72;
    text-transform: uppercase;
  }
  .block .sub{
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    opacity: 0.6;
    margin-top: 6px;
    font-style: italic;
  }
  .block .empty{
    font-size: 14px;
    font-weight: 600;
    opacity: 0.6;
  }

  footer.site{
    max-width: 1600px;
    margin: 0 auto 32px;
    padding: 0 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
  }

  .block.has-items{ cursor: pointer; transition: filter 0.15s ease; }
  .block.has-items:hover{ filter: brightness(0.96); }
  .block.has-items:active{ filter: brightness(0.9); }
  .study-hint{
    position: absolute;
    right: 20px;
    bottom: 16px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    opacity: 0.55;
  }

  .study-overlay{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .study-overlay[hidden]{ display: none; }
  .study-close{
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 2.5px solid var(--ink);
    background: rgba(255,255,255,0.5);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    color: var(--ink);
  }
  .study-progress{
    position: absolute;
    top: 24px;
    left: 24px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.5);
  }
  .study-card{
    background: #fff;
    border: 3px solid var(--ink);
    max-width: 640px;
    width: 100%;
    min-height: 360px;
    padding: 44px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    gap: 18px;
  }
  .study-tag{
    align-self: center;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .study-front{
    font-weight: 900;
    font-size: clamp(24px, 4vw, 38px);
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .block[data-key="quotes"] ~ .study-overlay .study-front,
  .study-overlay.quote-mode .study-front{ text-transform: none; }
  .study-back{
    display: none;
    flex-direction: column;
    gap: 10px;
    border-top: 2px solid var(--line, #ddd);
    padding-top: 16px;
  }
  .study-back.visible{ display: flex; }
  .study-back .b1{ font-size: 17px; font-weight: 700; }
  .study-back .b2{ font-size: 14px; font-style: italic; opacity: 0.65; }
  .study-actions{
    margin-top: 8px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .study-btn{
    font-family: var(--sans);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 14px 28px;
    border-radius: 999px;
    border: 2.5px solid var(--ink);
    cursor: pointer;
    background: #fff;
    color: var(--ink);
  }
  .study-btn.primary{ background: var(--ink); color: #fff; }
  .study-btn.learning{ background: #fff; }
  .study-btn.got-it{ background: var(--ink); color: #fff; }
  .study-done{
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }

  /* ------------------------------------------------------------ */
  /* Book List section — rendered as a clean data table (initials  */
  /* avatar, title + overview subline, colored genre/status pills, */
  /* a link chip for source, plain date) rather than stacked cards.*/
  /* ------------------------------------------------------------ */
  .book-genre-filter{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 12px;
  }
  .genre-filter-chip{
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid rgba(17,17,17,0.15);
    background: #fff;
    color: rgba(17,17,17,0.6);
    user-select: none;
  }
  .genre-filter-chip:hover{ border-color: rgba(17,17,17,0.35); }
  .genre-filter-chip.active{ border-color: transparent; }
  .book-list{
    width: 100%;
    height: 420px;
    flex-shrink: 0;
    overflow: auto;
    border: 1.5px solid rgba(17,17,17,0.14);
    border-radius: 10px;
    background: #fff;
  }
  .book-table{ min-width: 860px; width: 100%; }
  .book-table-head, .book-tr{
    display: grid;
    grid-template-columns: 1.3fr 2.2fr 0.85fr 0.8fr 0.8fr 1fr 0.75fr 0.6fr;
    align-items: start;
  }
  .book-table-head{
    position: sticky;
    top: 0;
    z-index: 1;
    background: #fafaf6;
    border-bottom: 1.5px solid rgba(17,17,17,0.14);
  }
  .book-th{
    padding: 10px 14px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(17,17,17,0.45);
    white-space: nowrap;
  }
  .book-tr{
    border-bottom: 1px solid rgba(17,17,17,0.08);
    transition: background 0.12s ease;
  }
  .book-tr:last-child{ border-bottom: none; }
  .book-tr:hover{ background: rgba(17,17,17,0.035); }
  .book-td{
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;

<body>
  <div class="world-clock">
    <div class="wc-inner">
      <div class="wc-cell" data-tz="America/New_York"><span class="wc-time">--:--</span><span class="wc-city">New York</span></div>
      <div class="wc-cell" data-tz="America/Los_Angeles"><span class="wc-time">--:--</span><span class="wc-city">Los Angeles</span></div>
      <div class="wc-cell" data-tz="Europe/London"><span class="wc-time">--:--</span><span class="wc-city">London</span></div>
      <div class="wc-cell" data-tz="Europe/Vienna"><span class="wc-time">--:--</span><span class="wc-city">Vienna</span></div>
      <div class="wc-cell" data-tz="Asia/Shanghai"><span class="wc-time">--:--</span><span class="wc-city">Beijing</span></div>
    </div>
    <div class="wc-wx" id="wcWeather">Loading NYC weather…</div>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">Homebase Hub</div>
      <div class="date-pill" id="todayDate"></div>
    </div>
  </div>

  <div class="banner">
    <div id="sampleBanner" class="banner-inner" hidden></div>
  </div>

  <div class="stage">
    <div class="mosaic" id="mosaic"></div>
  </div>

  <footer class="site">Homebase Hub — refreshes automatically every day.</footer>

  <div class="study-overlay" id="studyOverlay" hidden>
    <button class="study-close" id="studyClose" aria-label="Close">&times;</button>
    <div class="study-progress" id="studyProgress"></div>
    <div class="study-card" id="studyCard"></div>
  </div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // World clock (NYC / LA / London / Vienna / Beijing) + NYC weather.
  // Runs independently of the Google Sheet data below, so it keeps
  // working even if the sheet fails to load. Time is computed straight
  // from each city's IANA timezone (exact, no API needed). Weather is
  // pulled live from the National Weather Service's public API
  // (api.weather.gov, run by NOAA) — LaGuardia (KLGA) is used because
  // it reliably reports a full current-conditions reading, unlike the
  // closer Central Park station which often reports temperature only.
  // ---------------------------------------------------------------
  (function initWorldClock(){
    const tzFormatters = {};
    function fmtFor(tz){
      if(!tzFormatters[tz]){
        tzFormatters[tz] = new Intl.DateTimeFormat("en-GB", {
          timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false
        });
      }
      return tzFormatters[tz];
    }
    function tickClocks(){
      const now = new Date();
      document.querySelectorAll(".wc-cell").forEach(cell => {
        const tz = cell.getAttribute("data-tz");
        const timeEl = cell.querySelector(".wc-time");
        if(tz && timeEl) timeEl.textContent = fmtFor(tz).format(now);
      });
    }
    tickClocks();
    setInterval(tickClocks, 1000);

    const wxEl = document.getElementById("wcWeather");
    const wxTimeFmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", hour: "numeric", minute: "2-digit", hour12: true
    });
    function loadWeather(){
      if(!wxEl) return;
      fetch("https://api.weather.gov/stations/KLGA/observations/latest", {
        headers: { "Accept": "application/geo+json" }
      })
        .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(data => {
          const p = data.properties || {};
          const tempC = p.temperature && p.temperature.value;
          const desc = p.textDescription;
          if(tempC == null){ throw new Error("no temperature in response"); }
          const tempF = Math.round(tempC * 9 / 5 + 32);
          const asOf = p.timestamp ? wxTimeFmt.format(new Date(p.timestamp)) + " ET" : "";
          wxEl.innerHTML = "NYC WX — " + tempF + "°F" + (desc ? " " + escapeWx(desc) : "") +
            ' <span class="wc-src">Source: NWS, LaGuardia' + (asOf ? " · " + asOf : "") + "</span>";
        })
        .catch(() => {
          wxEl.textContent = "NYC weather unavailable right now";
        });
    }
    function escapeWx(s){
      return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }
    loadWeather();
    setInterval(loadWeather, 15 * 60 * 1000);
  })();

  // ---------------------------------------------------------------
  // CONFIG — one entry per Google Sheet tab. Edit sheetId once you
  // have it; edit/add/remove SECTIONS if your tabs change.
  //
  // style "quote"  expects fields: { text, attribution, meta }
  // style "term"   expects fields: { primary, tag, body, example }
  // ---------------------------------------------------------------
  const CONFIG = {
    sheetId: "1NV4_3O7QdlHTyDJjkB1xSSJmTXxv5bYyBKgejkWIEgU",
    dailyCount: 1
  };

  const SECTIONS = [
    {
      key: "quotes", sheetName: "Quotes", title: "Quote", style: "quote",
      map: r => ({ text: r.quote, attribution: r.author, meta: r.source })
    },
    {
      key: "dictionary", sheetName: "Dictionary", title: "Dictionary", style: "term",
      map: r => ({ primary: r.word, tag: r.part_of_speech, body: r.definition, example: r.example })
    },
    {
      key: "phrases", sheetName: "Phrases", title: "Phrase", style: "term",
      map: r => ({ primary: r.phrase, tag: "", body: r.meaning, example: r.example })
    },
    {
      key: "dailylaw", sheetName: "Daily Law", title: "48 Laws of Power", style: "term",
      // rotates: "sequential" — instead of the daily seeded shuffle used by
      // the other sections, this one walks through the sheet's rows in
      // order (Law 1, Law 2, Law 3, ...), one per day, wrapping back to
      // the top after the last row. sequentialStart is the date Law 1
      // (the first row) should show — change it if you re-sequence the
      // sheet later.
      rotates: "sequential",
      sequentialStart: "2026-09-14",
      map: r => ({ primary: r.law, tag: r.number ? ("Law " + r.number) : "", body: r.summary, example: r.application })
    },
    {
      key: "gracian", sheetName: "Gracian", title: "The Art of Worldly Wisdom", style: "term",
      // Baltasar Gracian's 300 maxims (tr. Joseph Jacobs, 1892 — public
      // domain), one per day, walked through in book order and wrapping
      // back to the top after maxim 300. sequentialStart is the date
      // maxim 1 (day column value 1, the first row) should show.
      rotates: "sequential",
      sequentialStart: "2026-09-24",
      map: r => ({ primary: r.title, tag: r.day ? ("Maxim " + r.day) : "", body: r.text, example: r.context })
    },
    {
      key: "dailyenforcement", sheetName: "Daily Enforcement", title: "Morning Mantra", style: "term",
      // rotates: false — this one does NOT cycle daily. It always shows
      // the LAST row in the sheet, so it stays fixed until you edit it
      // (change that row's text, or add a new row below it) whenever
      // your mindset/goals evolve.
      rotates: false,
      map: r => ({ primary: r.affirmation, tag: r.focus, body: r.reminder, example: "" })
    },
    {
      // style "booklist" — unlike the other sections this one does NOT
      // rotate a single pick per day. It's a running reference list: every
      // row in the sheet shows up, newest first, so you can scan it when
      // deciding what to read next.
      key: "books", sheetName: "Books", title: "Book List", style: "booklist",
      map: r => ({
        title: r.title, author: r.author, dateAdded: r.date_added,
        overview: r.overview, genre: r.genre, source: r.source, status: r.status,
        pages: r.page_count
      })
    }
  ];

  // ---------------------------------------------------------------
  // CSV fetch + parse (Google Sheets "gviz" endpoint — requires the
  // sheet's sharing set to "Anyone with the link: Viewer").
  // ---------------------------------------------------------------
  function sheetUrl(sheetName){
    // The "&_=" cache-buster forces a fresh fetch every page load instead
    // of letting the browser reuse a cached response from before you last
    // edited the sheet (this is why an updated sheet can seem to "not
    // show up" until a hard refresh — now it always fetches fresh).
    return "https://docs.google.com/spreadsheets/d/" + CONFIG.sheetId +
      "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) +
      "&_=" + Date.now();
  }

  function parseCsv(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ /* skip */ }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    if(!rows.length) return [];
    const headers = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g,'_'));
    return rows.slice(1)
      .filter(r => r.some(cell => cell && cell.trim().length))
      .map(r => {
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = (r[idx] || "").trim(); });
        return obj;
      });
  }

  function fetchSheet(sheetName){
    return fetch(sheetUrl(sheetName), { cache: "no-store" })
      .then(res => { if(!res.ok) throw new Error("bad status " + res.status); return res.text(); })
      .then(parseCsv);
  }

  // ---------------------------------------------------------------
  // Deterministic daily rotation: a fixed seeded shuffle (same order
  // for everyone, every day) plus a day-based window, so the picks
  // cycle through the whole list before repeating.
  // ---------------------------------------------------------------
  function seededRandom(seed){
    let t = seed + 0x6D2B79F5;
    return function(){
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seededShuffleIndices(n, seedString){
    let seed = 0;
    for(let i = 0; i < seedString.length; i++){ seed = (seed * 31 + seedString.charCodeAt(i)) >>> 0; }
    const rand = seededRandom(seed);
    const idx = Array.from({length:n}, (_, i) => i);
    for(let i = n - 1; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    return idx;
  }

  function localDayNumber(){
    const d = new Date();
    const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.floor(midnight.getTime() / 86400000);
  }

  function sequentialIndex(n, startDateStr){
    if(n <= 0) return 0;
    const day = localDayNumber();
    const start = new Date(startDateStr + "T00:00:00");
    const epoch = Math.floor(new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime() / 86400000);
    let idx = (day - epoch) % n;
    if(idx < 0) idx += n;
    return idx;
  }

  function pickToday(items, count, seedString){
    const n = items.length;
    if(n === 0) return [];
    if(n <= count) return items.slice();
    const order = seededShuffleIndices(n, seedString);
    const day = localDayNumber();
    const base = (day * count) % n;
    const picked = [];
    for(let k = 0; k < count; k++){
      picked.push(items[order[(base + k) % n]]);
    }
    return picked;
  }

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  // Study mode (click a box to open flashcards) is built below but
  // switched off for now — flip this to true to turn it back on.
  const ENABLE_STUDY_MODE = false;

  // Soft pastel palette the boxes rotate through daily — same color
  // for everyone on a given day, different sections get different
  // colors, and the rotation cycles through the whole palette.
  const PASTELS = ["#BFE3D0", "#F5C6C6", "#D9CFF2", "#BBD8EF", "#F5E3B3", "#F3D9BE"];
  function colorForSection(index){
    const day = localDayNumber();
    return PASTELS[(day + index) % PASTELS.length];
  }

  function blockBodyHtml(section, item, errorMsg){
    const hint = ENABLE_STUDY_MODE ? '<span class="study-hint">STUDY&nbsp;&rarr;</span>' : "";
    if(!item){
      if(errorMsg){
        return `<span class="tag">${escapeHtml(section.title)}</span><p class="headline">Couldn't load</p><p class="support">${escapeHtml(errorMsg)}</p>`;
      }
      return `<span class="tag">${escapeHtml(section.title)}</span><p class="headline">TBD</p><p class="support">BEN START ADDING ITEMS</p>`;
    }
    if(section.style === "quote"){
      return `
        <span class="tag">${escapeHtml(section.title)}</span>
        <p class="headline">${escapeHtml(item.text)}</p>
        <p class="support">${escapeHtml(item.attribution || "Unknown")}${item.meta ? " — " + escapeHtml(item.meta) : ""}</p>
        ${hint}
      `;
    }
    return `
      <span class="tag">${escapeHtml(item.tag) || escapeHtml(section.title)}</span>
      <p class="headline">${escapeHtml(item.primary)}</p>
      <p class="support">${escapeHtml(item.body)}</p>
      ${item.example ? `<p class="sub">${escapeHtml(item.example)}</p>` : ""}
      ${hint}
    `;
  }

  // ---------------------------------------------------------------
  // Book List — a running reference list rather than a daily pick.
  // Newest (by date_added) first; the tile shows a scrollable preview
  // and an "Expand list" button opens a larger fixed-size overlay with
  // the same list rendered bigger, instead of dumping everything onto
  // the page and making it endlessly long.
  // ---------------------------------------------------------------
  function parseDateSafe(s){
    if(!s) return 0;
    const t = Date.parse(s);
    return isNaN(t) ? 0 : t;
  }

  function formatBookDate(s){
    const t = Date.parse(s);
    if(isNaN(t)) return s || "";
    return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function sortBooksDesc(items){
    return items.slice().sort((a, b) => parseDateSafe(b.dateAdded) - parseDateSafe(a.dateAdded));
  }

  // Consistent (not random) color per genre/status/title string, drawn
  // from a fixed pastel palette — same tag always gets the same color,
  // like Notion-style select tags, without needing to hand-pick colors
  // per value.
  const TAG_PALETTE = [
    { bg: "#DBEAFE", fg: "#1D4ED8" },
    { bg: "#DCFCE7", fg: "#15803D" },
    { bg: "#FEF3C7", fg: "#92400E" },
    { bg: "#FCE7F3", fg: "#9D174D" },
    { bg: "#EDE9FE", fg: "#5B21B6" },
    { bg: "#FEE2E2", fg: "#B91C1C" },
    { bg: "#CCFBF1", fg: "#0F766E" },
    { bg: "#FFE4E6", fg: "#9F1239" }
  ];
  function hashStr(s){
    let h = 0;
    const str = String(s || "");
    for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }
  function tagColor(s){
    return TAG_PALETTE[hashStr(s) % TAG_PALETTE.length];
  }
  function pillHtml(text){
    if(!text) return "";
    const c = tagColor(text);
    return `<span class="book-pill" style="background:${c.bg};color:${c.fg}">${escapeHtml(text)}</span>`;
  }
  function avatarHtml(title){
    const letter = (title || "?").trim().charAt(0).toUpperCase() || "?";
    const c = tagColor(title || "");
    return `<span class="book-avatar" style="background:${c.bg};color:${c.fg}">${escapeHtml(letter)}</span>`;
  }
  function sourceChipHtml(source){
    if(!source) return "";
    const trimmed = source.trim();
    const display = trimmed.length > 26 ? trimmed.slice(0, 24) + "…" : trimmed;
    const label = escapeHtml(display);
    if(/^https?:\/\//i.test(trimmed)){
      return `<a class="book-source-chip" href="${escapeHtml(trimmed)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    }
    return `<span class="book-source-chip">${label}</span>`;
  }

  function bookRowHtml(b){
    return `
      <div class="book-tr">
        <div class="book-td td-title">
          ${avatarHtml(b.title)}
          <div class="book-title-wrap">
            <div class="book-title">${escapeHtml(b.title)}</div>
          </div>
        </div>
        <div class="book-td td-desc">${b.overview ? escapeHtml(b.overview) : ""}</div>
        <div class="book-td td-author">${b.author ? escapeHtml(b.author) : ""}</div>
        <div class="book-td td-genre">${pillHtml(b.genre)}</div>
        <div class="book-td td-status">${pillHtml(b.status)}</div>
        <div class="book-td td-source">${sourceChipHtml(b.source)}</div>
        <div class="book-td td-date">${b.dateAdded ? escapeHtml(formatBookDate(b.dateAdded)) : ""}</div>
        <div class="book-td td-pages">${b.pages ? escapeHtml(b.pages) : ""}</div>
      </div>
    `;
  }

  function bookTableHtml(sorted){
    return `
      <div class="book-table">
        <div class="book-table-head">
          <div class="book-th th-title">Title</div>
          <div class="book-th th-desc">Description</div>
          <div class="book-th th-author">Author</div>
          <div class="book-th th-genre">Genre</div>
          <div class="book-th th-status">Status</div>
          <div class="book-th th-source">Source</div>
          <div class="book-th th-date">Added</div>
          <div class="book-th th-pages">Pages</div>
        </div>
        <div class="book-table-body">${sorted.map(bookRowHtml).join("")}</div>
      </div>
    `;
  }

  function genreFilterHtml(genres, active){
    const chips = [`<button type="button" class="genre-filter-chip${active === "all" ? " active" : ""}" data-genre="all"${active === "all" ? ' style="background:var(--ink);color:#fff;border-color:var(--ink);"' : ""}>All</button>`];
    genres.forEach(g => {
      const isActive = active === g;
      const c = tagColor(g);
      const style = isActive ? ` style="background:${c.bg};color:${c.fg};border-color:${c.bg};"` : "";
      chips.push(`<button type="button" class="genre-filter-chip${isActive ? " active" : ""}" data-genre="${escapeHtml(g)}"${style}>${escapeHtml(g)}</button>`);
    });
    return chips.join("");
  }

  function renderBooksBlock(section, mapped, el, errorMsg){
    if(!mapped.length){
      el.innerHTML = blockBodyHtml(section, null, errorMsg);
      return;
    }
    const genres = Array.from(new Set(mapped.map(b => b.genre).filter(Boolean))).sort((a, b) => a.localeCompare(b));
    let activeGenre = "all";

    function draw(){
      // Rebuilding el.innerHTML replaces the .book-list div outright, so a
      // fresh (unscrolled) element would normally reset the visible scroll
      // position to the top every time a filter chip is clicked. Capture the
      // outgoing scroll position first and re-apply it to the new element
      // (the browser clamps it automatically if the new list is shorter),
      // so switching filters never yanks you back to the top of the list.
      const prevList = el.querySelector(".book-list");
      const savedScrollTop = prevList ? prevList.scrollTop : 0;

      const filtered = activeGenre === "all" ? mapped : mapped.filter(b => (b.genre || "") === activeGenre);
      const sorted = sortBooksDesc(filtered);
      const tableHtml = bookTableHtml(sorted);
      el.innerHTML = `
        <span class="tag">${escapeHtml(section.title)}</span>
        ${genres.length ? `<div class="book-genre-filter">${genreFilterHtml(genres, activeGenre)}</div>` : ""}
        <div class="book-list">${tableHtml}</div>
      `;
      const newList = el.querySelector(".book-list");
      if(newList) newList.scrollTop = savedScrollTop;
      el.querySelectorAll(".genre-filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          activeGenre = btn.getAttribute("data-genre");
          draw();
        });
      });
    }
    draw();
  }

  function buildStaticDom(){
    const mosaic = document.getElementById("mosaic");
    mosaic.innerHTML = SECTIONS.map(s => `<div class="block" data-key="${s.key}"></div>`).join("");
  }

  document.getElementById("todayDate").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "short", month: "short", day: "numeric"
  });

  const SECTION_ITEMS = {};

  function boot(dataBySection, errorsBySection){
    errorsBySection = errorsBySection || {};
    buildStaticDom();
    SECTIONS.forEach((section, i) => {
      const raw = dataBySection[section.key] || [];
      const mapped = raw.map(section.map);
      SECTION_ITEMS[section.key] = mapped;
      const el0 = document.querySelector('.block[data-key="' + section.key + '"]');
      el0.style.background = colorForSection(i);
      if(section.style === "booklist"){
        renderBooksBlock(section, mapped, el0, errorsBySection[section.key]);
        return;
      }
      let current;
      if(section.rotates === false){
        current = mapped[mapped.length - 1];
      } else if(section.rotates === "sequential"){
        current = mapped.length ? mapped[sequentialIndex(mapped.length, section.sequentialStart)] : undefined;
      } else {
        current = pickToday(mapped, CONFIG.dailyCount, "homebase-hub-" + section.key)[0];
      }
      const el = el0;
      el.innerHTML = blockBodyHtml(section, current, errorsBySection[section.key]);
      if(ENABLE_STUDY_MODE){
        el.classList.toggle("has-items", mapped.length > 0);
        el.addEventListener("click", () => { if(mapped.length) openStudy(section.key); });
      }
    });
  }

  // ---------------------------------------------------------------
  // Study mode — click a box, cycle its items as flashcards, rate
  // yourself, and let items you're still learning come back around
  // more often. Progress is saved per-browser in localStorage.
  // ---------------------------------------------------------------
  const PROGRESS_KEY = "homebase-hub-progress-v1";

  function loadProgress(){
    try{
      const raw = localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch(e){ /* ignore */ }
  }
  let PROGRESS = loadProgress();

  function hashText(s){
    let h = 5381;
    const str = String(s || "");
    for(let i = 0; i < str.length; i++){ h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }
  function itemId(section, item){
    return hashText(section.style === "quote" ? item.text : item.primary);
  }

  let study = null; // { key, section, items, queue, qPos, current, revealed }

  function boxFor(key, id){
    return (PROGRESS[key] && PROGRESS[key][id]) || 1;
  }
  function setBox(key, id, box){
    if(!PROGRESS[key]) PROGRESS[key] = {};
    PROGRESS[key][id] = box;
    saveProgress(PROGRESS);
  }

  function buildQueue(key, items){
    const weighted = [];
    items.forEach((item, idx) => {
      const box = boxFor(key, itemId(SECTIONS.find(s => s.key === key), item));
      const weight = box <= 1 ? 4 : box === 2 ? 2 : 1;
      for(let w = 0; w < weight; w++) weighted.push(idx);
    });
    for(let i = weighted.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [weighted[i], weighted[j]] = [weighted[j], weighted[i]];
    }
    return weighted;
  }

  function masteredCount(key, items, section){
    return items.filter(it => boxFor(key, itemId(section, it)) >= 3).length;
  }

  function openStudy(key){
    const section = SECTIONS.find(s => s.key === key);
    const items = SECTION_ITEMS[key] || [];
    if(!items.length) return;
    study = { key, section, items, queue: buildQueue(key, items), qPos: 0, revealed: false };
    document.getElementById("studyOverlay").style.background = getComputedStyle(
      document.querySelector('.block[data-key="' + key + '"]')
    ).backgroundColor;
    document.getElementById("studyOverlay").hidden = false;
    document.body.style.overflow = "hidden";
    renderStudyCard();
  }

  function closeStudy(){
    study = null;
    document.getElementById("studyOverlay").hidden = true;
    document.body.style.overflow = "";
  }

  function renderStudyCard(){
    if(!study) return;
    if(study.qPos >= study.queue.length){
      study.queue = buildQueue(study.key, study.items);
      study.qPos = 0;
    }
    const idx = study.queue[study.qPos];
    const item = study.items[idx];
    study.current = item;
    study.revealed = false;

    const mastered = masteredCount(study.key, study.items, study.section);
    document.getElementById("studyProgress").textContent =
      escapeHtml(study.section.title) + " · " + mastered + " / " + study.items.length + " mastered";

    const front = study.section.style === "quote" ? item.text : item.primary;
    const card = document.getElementById("studyCard");
    card.innerHTML = `
      <span class="study-tag">${escapeHtml(study.section.title)}</span>
      <p class="study-front">${escapeHtml(front)}</p>
      <div class="study-back" id="studyBack"></div>
      <div class="study-actions" id="studyActions">
        <button class="study-btn primary" id="studyReveal">Reveal</button>
      </div>
    `;
    document.getElementById("studyReveal").addEventListener("click", revealStudyCard);
  }

  function revealStudyCard(){
    if(!study || study.revealed) return;
    study.revealed = true;
    const item = study.current;
    const back = document.getElementById("studyBack");
    if(study.section.style === "quote"){
      back.innerHTML = `<p class="b1">${escapeHtml(item.attribution || "Unknown")}${item.meta ? " — " + escapeHtml(item.meta) : ""}</p>`;
    } else {
      back.innerHTML = `
        <p class="b1">${escapeHtml(item.body)}</p>
        ${item.example ? `<p class="b2">${escapeHtml(item.example)}</p>` : ""}
      `;
    }
    back.classList.add("visible");
    document.getElementById("studyActions").innerHTML = `
      <button class="study-btn learning" id="studyLearning">Still learning</button>
      <button class="study-btn got-it" id="studyGotIt">Got it</button>
    `;
    document.getElementById("studyLearning").addEventListener("click", () => rateStudyCard(1));
    document.getElementById("studyGotIt").addEventListener("click", () => rateStudyCard(null));
  }

  function rateStudyCard(forceBox){
    if(!study) return;
    const id = itemId(study.section, study.current);
    const box = forceBox !== null ? forceBox : Math.min(3, boxFor(study.key, id) + 1);
    setBox(study.key, id, box);
    study.qPos++;
    renderStudyCard();
  }

  document.getElementById("studyClose").addEventListener("click", closeStudy);
  document.addEventListener("keydown", (e) => {
    if(!study) return;
    if(e.key === "Escape") closeStudy();
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      if(!study.revealed) revealStudyCard();
    }
  });

  // Promise.allSettled (not Promise.all) so ONE tab's sheet having a
  // problem doesn't blank out every other tab — each section fetches and
  // fails independently, and a failed section shows the actual error
  // message in place of "TBD" so a real problem is easy to diagnose
  // instead of looking identical to "you haven't added rows yet."
  Promise.allSettled(SECTIONS.map(s => fetchSheet(s.sheetName)))
    .then(results => {
      const dataBySection = {};
      const errorsBySection = {};
      let anyError = false;
      SECTIONS.forEach((s, i) => {
        const r = results[i];
        if(r.status === "fulfilled"){
          dataBySection[s.key] = r.value;
        } else {
          dataBySection[s.key] = [];
          errorsBySection[s.key] = (r.reason && r.reason.message) ? r.reason.message : String(r.reason);
          anyError = true;
        }
      });
      if(anyError){
        document.getElementById("sampleBanner").hidden = false;
        document.getElementById("sampleBanner").textContent =
          "Some tabs couldn't be loaded from your Google Sheet — see the affected box(es) below for the specific error.";
      }
      boot(dataBySection, errorsBySection);
    });
})();
</script>
</body>
</html>
